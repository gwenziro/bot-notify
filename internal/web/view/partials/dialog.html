<div id="confirmation-dialog-template" style="display:none;">
  <div class="dialog-overlay">
    <div class="glass-card dialog-box">
      <div class="dialog-header">
        <h3 class="dialog-title"></h3>
        <button class="btn-icon dialog-close">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="dialog-body">
        <p class="dialog-message"></p>
        <p class="dialog-description"></p>
      </div>
      <div class="dialog-footer">
        <button class="btn btn-outline dialog-cancel">Batal</button>
        <button class="btn btn-danger dialog-confirm">Konfirmasi</button>
      </div>
    </div>
  </div>
</div>
